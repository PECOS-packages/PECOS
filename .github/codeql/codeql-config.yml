name: PECOS CodeQL config

# Rust extraction runs against the whole checkout in build-mode "none". Skip
# directories whose only Rust content is standalone helper crates that are not
# workspace members: the extractor finds their Cargo.toml, tries to load each
# as its own workspace, and extracts code nobody ships.
paths-ignore:
  # Doc-test crate that only exercises documentation examples.
  - python/quantum-pecos/tests/docs/rust_crate
  # Native benchmark driver.
  - scripts/native_bench
  # Fuzz targets.
  - exp/zlup/fuzz

query-filters:
  # rust/cleartext-logging flags values whose names look sensitive reaching a
  # log, panic or assert message. PECOS handles no passwords, tokens or keys, and
  # all 23 alerts it raised (2026-08-27 to 2026-10-08) were naming accidents:
  # the distance-search outcomes' `Certified` variants ("cert") and PyO3's
  # extract_pyclass_ref_trusted flowing into panic/assert messages that print
  # indices, probabilities and distances. Re-enable it if PECOS starts handling credentials (for example,
  # API tokens for remote backends).
  - exclude:
      id: rust/cleartext-logging
