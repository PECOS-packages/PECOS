# CUDA Build Check - Verifies CUDA-related crates compile correctly
# Note: Full runtime testing requires cuQuantum SDK which is not available in CI
# For actual GPU testing, use a self-hosted runner with CUDA and cuQuantum installed

name: CUDA Build Check

permissions:
  contents: read

env:
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1

on:
  push:
    branches: [ "main", "master", "development", "dev" ]
    paths:
      - 'crates/pecos-cuquantum/**'
      - 'crates/pecos-cuquantum-sys/**'
      - 'python/pecos-rslib-cuda/**'
      # Where an eager import would break the CUDA import-laziness contract.
      - 'python/quantum-pecos/src/pecos/__init__.py'
      - 'python/quantum-pecos/src/pecos/simulators/**'
      - 'python/quantum-pecos/tests/pecos/test_native_extension_import_laziness.py'
      - '.github/workflows/cuda-build-check.yml'
  pull_request:
    branches: [ "main", "master", "development", "dev" ]
    paths:
      - 'crates/pecos-cuquantum/**'
      - 'crates/pecos-cuquantum-sys/**'
      - 'python/pecos-rslib-cuda/**'
      # Where an eager import would break the CUDA import-laziness contract.
      - 'python/quantum-pecos/src/pecos/__init__.py'
      - 'python/quantum-pecos/src/pecos/simulators/**'
      - 'python/quantum-pecos/tests/pecos/test_native_extension_import_laziness.py'
      - '.github/workflows/cuda-build-check.yml'
  workflow_dispatch:

concurrency:
  # Pull requests cancel superseded runs. Every other event (a push to a main
  # branch, a schedule, a dispatch) gets its own group so no trunk commit loses
  # its validation or cache save to a later merge.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cuda-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Harden apt against mirror flakiness
        run: ./scripts/ci/harden-apt.sh

      - name: Install Rust
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Set up Rust
        run: |
          rustup override set stable
          rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin
          save-if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        id: cuda-toolkit
        # This step downloads from an external host and normally finishes in a couple of
        # minutes. Without a bound, a stalled download hangs the job indefinitely -- one did
        # so for four hours on 2026-08-18, and every dependent job waits behind it.
        timeout-minutes: 15
        with:
          cuda: '12.6.3'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Check pecos-cuquantum-sys compiles (stub mode)
        run: |
          echo "Building pecos-cuquantum-sys (will use stubs since cuQuantum SDK is not installed)..."
          cargo check --locked -p pecos-cuquantum-sys

      - name: Check pecos-cuquantum compiles (stub mode)
        run: |
          echo "Building pecos-cuquantum (will use stubs since cuQuantum SDK is not installed)..."
          cargo check --locked -p pecos-cuquantum

      - name: Check pecos-rslib-cuda compiles (stub mode)
        run: |
          echo "Building pecos-rslib-cuda Python bindings..."
          cargo check --locked -p pecos-rslib-cuda

      - name: Run clippy on CUDA crates
        run: |
          echo "Running clippy on CUDA crates..."
          cargo clippy --locked -p pecos-cuquantum-sys -p pecos-cuquantum -p pecos-rslib-cuda -- -D warnings

      - name: Verify stub mode detection
        run: |
          echo "Verifying that build correctly detects stub mode..."
          # The crates should compile but is_cuquantum_available() should return false
          cargo build --locked -p pecos-cuquantum --release
          # Note: We can't actually run the binary to test is_cuquantum_available()
          # because it requires the cuQuantum runtime, but the build succeeding
          # in stub mode means the detection is working

  # Documentation for setting up GPU testing
  # The Python CUDA package in its no-SDK form. No CUDA toolkit is installed, so the
  # cuQuantum crates take their stub path and pecos-cuquantum does not auto-install
  # the SDK. This runs the import-level contracts (import laziness, module surface,
  # "not available" errors) that otherwise run in no CI lane (#1061).
  cuda-python-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LLVM_VERSION: "21.1"
      LLVM_RELEASE_VERSION: "21.1.8"
      PYTHONUTF8: 1
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: true
          save-cache: false

      - name: Set up Rust
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin
          save-if: false
          shared-key: python-core

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: just ci-env

      - name: Build the Python test environment
        run: just python-ci-build-test

      - name: Build pecos-rslib-cuda without the CUDA SDK
        run: uv run --frozen --package pecos-rslib-cuda maturin develop --uv --locked --manifest-path python/pecos-rslib-cuda/Cargo.toml

      - name: Require the stub build
        # If the SDK ever appeared on this runner, the tests below would take the
        # available-SDK branch and skip; fail instead so the lane keeps testing the stub.
        run: |
          uv run --frozen python - <<'PY'
          import pecos_rslib_cuda as cuda
          probes = {name: getattr(cuda, name)() for name in dir(cuda) if name.startswith("is_")}
          print(probes)
          if any(probes.values()):
              raise SystemExit(f"expected a stub build with no cuQuantum SDK, got {probes}")
          PY

      - name: Run the CUDA import-level tests
        run: >-
          uv run --frozen pytest -rs -p no:cacheprovider
          python/quantum-pecos/tests/pecos/test_native_extension_import_laziness.py
          python/pecos-rslib-cuda/tests

  cuda-testing-info:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: CUDA Testing Requirements
        run: |
          echo "=============================================="
          echo "CUDA GPU Testing Requirements"
          echo "=============================================="
          echo ""
          echo "Full runtime tests for pecos-rslib-cuda require:"
          echo "  1. NVIDIA GPU with CUDA support"
          echo "  2. CUDA Toolkit 12.x installed"
          echo "  3. cuQuantum SDK installed"
          echo ""
          echo "To run GPU tests locally:"
          echo "  1. Install CUDA Toolkit: https://developer.nvidia.com/cuda-downloads"
          echo "  2. Install cuQuantum SDK: https://developer.nvidia.com/cuquantum-sdk"
          echo "  3. Run: cargo test -p pecos-cuquantum"
          echo "  4. Build Python package: maturin develop -m python/pecos-rslib-cuda/Cargo.toml"
          echo ""
          echo "For self-hosted CI runners with GPU support:"
          echo "  - Use runners labeled with 'cuda' or 'gpu'"
          echo "  - Ensure cuQuantum SDK is pre-installed"
          echo "  - Run: cargo test -p pecos-cuquantum"
          echo "=============================================="
