name: Nightly validation

# Checks no other lane runs: the Rust workspace tests in the release profile
# (every other lane tests the dev profile) and the release-build performance
# tripwires (pytest marker `performance`). Failures are reported by the
# Trunk CI issues workflow.

permissions:
  contents: read

env:
  LLVM_VERSION: "21.1"
  LLVM_RELEASE_VERSION: "21.1.8"
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

on:
  push:
    tags: [ "py-*", "jl-*", "rs-*" ]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  # A pull request that edits this workflow runs it, since a scheduled
  # workflow is otherwise first exercised after it merges.
  pull_request:
    branches: [ "main", "master", "development", "dev" ]
    paths:
      - '.github/workflows/nightly.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The release profile's fat LTO and single codegen unit suit shipped
      # artifacts but made this build of every test binary take 65 minutes.
      # What this job tests -- opt-level 3 with debug assertions and overflow
      # checks off -- does not depend on them.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: false

      - name: Set up Rust
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: just ci-env

      - name: Run Rust tests (release profile)
        run: just rstest release

  python-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: false

      - name: Set up Rust
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: just ci-env

      - name: Run performance tests (release build)
        run: just python-ci-perf
