name: OSV Scanner

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    tags: [ "py-*", "jl-*", "rs-*" ]
    branches: [ "main", "master", "development", "dev" ]
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:

concurrency:
  # Pull requests cancel superseded runs. Every other event (a push to a main
  # branch, a schedule, a dispatch) gets its own group so no trunk commit loses
  # its validation or cache save to a later merge.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
