name: PR core gate

# Required pre-merge sentinel: runs the Linux core Python + Rust test suites on
# pull requests. Has NO `paths:` filter so it always reports a status (a
# path-filtered required check would stuck-block PRs that don't touch its
# paths). When a PR changes nothing the core suites depend on, the detect step
# short-circuits to success so docs-only / unrelated-workflow PRs stay fast.

permissions:
  contents: read

env:
  LLVM_VERSION: "14.0.6"
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-core:
    runs-on: ubuntu-latest
    # Python core build/test + Rust debug tests run serially here; a cold cache
    # (LLVM + native builds) needs headroom. Measure a cold run before tightening.
    timeout-minutes: 90
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Safe-biased: run the core suites unless EVERY changed file is clearly
      # unable to affect them. The markdown/text ignore is anchored to root-level
      # files only ([^/]+) -- nested package READMEs are pyproject `readme=`
      # build inputs (python/**/README.md, crate README.md) and MUST run. Any
      # path not in the ignore set defaults to running.
      - name: Detect core-relevant changes
        id: detect
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            echo "No PR base (manual run); running the core gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"
          printf '  %s\n' $changed
          ignore='^(docs/|\.github/ISSUE_TEMPLATE/|\.github/workflows/(julia-|go-|codeql)|[^/]+\.(md|rst|txt)$|LICENSE|CITATION)'
          if printf '%s\n' "$changed" | grep -qvE "$ignore"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Core-relevant changes detected; running core suites."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only non-core files changed; core gate passes without running suites."
          fi

      # The setup below intentionally mirrors the Linux legs of python-test.yml
      # (python-core) and rust-test.yml. Keep their action SHAs, uv/just/LLVM
      # versions, and cache keys in sync when editing either side.
      - name: Free Disk Space (Ubuntu)
        if: steps.detect.outputs.run == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: false
          swap-storage: true

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install the latest version of uv
        if: steps.detect.outputs.run == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.14"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

      - name: Set up Rust
        if: steps.detect.outputs.run == 'true'
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Verify cmake is available (MWPF decoder build)
        if: steps.detect.outputs.run == 'true'
        run: cmake --version

      - name: Install just
        if: steps.detect.outputs.run == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust
        if: steps.detect.outputs.run == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin
          save-if: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}
          workspaces: |
            python/pecos-rslib
            python/pecos-rslib-llvm

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        if: steps.detect.outputs.run == 'true'
        id: cache-llvm
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-14
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        if: steps.detect.outputs.run == 'true'
        run: just ci-env

      - name: Run core Python tests
        if: steps.detect.outputs.run == 'true'
        run: just python-ci-core

      - name: Run core Rust tests
        if: steps.detect.outputs.run == 'true'
        # debug profile keeps this sentinel fast; the full release matrix runs
        # post-merge on push via rust-test.yml.
        run: just rstest debug

      - name: Core gate passed (no core-relevant changes)
        if: steps.detect.outputs.run != 'true'
        run: echo "No core-relevant paths changed; core suites skipped."
