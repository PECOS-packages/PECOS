name: Python test / linting

permissions:
  contents: read

env:
  TRIGGER_ON_PR_PUSH: true
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1
  LLVM_VERSION: "14.0.6"

on:
  push:
    branches: [ "main", "master", "development", "dev" ]
    paths:
      - 'python/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'uv.lock'
      - 'Justfile'
      - 'scripts/ci/**'
      - 'scripts/check_python_workspace.py'
      - '.github/workflows/python-test.yml'
  pull_request:
    branches: [ "main", "master", "development", "dev" ]
    paths:
      - 'python/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'uv.lock'
      - 'Justfile'
      - 'scripts/ci/**'
      - 'scripts/check_python_workspace.py'
      - '.github/workflows/python-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Harden the runner (egress audit)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.12"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.11.14"
        enable-cache: true
        save-cache: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

    - name: Set up Rust
      run: |
        bash scripts/ci/ensure-rust.sh stable minimal
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        prefix-key: v1-rust-no-bin
        save-if: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

    - name: Sync Python dependencies
      run: just python-ci-sync

    - name: Run linting
      run: just lint check

  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PECOS_BUILD_MWPF: "1"
    steps:
    - name: Harden the runner (egress audit)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        tool-cache: false
        swap-storage: true

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.12"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.11.14"
        enable-cache: true
        save-cache: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

    - name: Set up Rust
      run: |
        bash scripts/ci/ensure-rust.sh stable minimal
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show

    - name: Verify cmake is available (MWPF decoder build)
      run: cmake --version

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        prefix-key: v1-rust-no-bin
        save-if: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}
        workspaces: |
          python/pecos-rslib
          python/pecos-rslib-llvm

    - name: Cache LLVM ${{ env.LLVM_VERSION }}
      id: cache-llvm
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

    - name: Ensure LLVM ${{ env.LLVM_VERSION }}
      run: just ci-env

    - name: Save LLVM ${{ env.LLVM_VERSION }} cache
      if: steps.cache-llvm.outputs.cache-hit != 'true' && github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name)
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: ${{ steps.cache-llvm.outputs.cache-primary-key }}

    - name: Build core Python packages
      run: just python-ci-build

    - name: Run core Python tests
      run: just pytest-ci-core

  python-compat-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-2022
            python-version: "3.10"
          - os: windows-2022
            python-version: "3.14"
          - os: macOS-latest
            python-version: "3.10"
          - os: macOS-latest
            python-version: "3.14"

    steps:
    - name: Harden the runner (egress audit)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        tool-cache: false
        swap-storage: true

    - name: Free Disk Space (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\hostedtoolcache\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\ProgramData\chocolatey" -Recurse -Force -ErrorAction SilentlyContinue

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.11.14"
        enable-cache: true
        save-cache: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

    - name: Set up Rust (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        rustup set default-host x86_64-pc-windows-msvc
        rustup toolchain install stable --profile minimal
        rustup default stable
        "$HOME\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:Path += ";$HOME\.cargo\bin"
        rustup show

    - name: Set up Rust (Unix)
      if: runner.os != 'Windows'
      run: |
        bash scripts/ci/ensure-rust.sh stable minimal
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        prefix-key: v1-rust-no-bin
        save-if: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}
        workspaces: |
          python/pecos-rslib
          python/pecos-rslib-llvm

    - name: Cache LLVM ${{ env.LLVM_VERSION }}
      id: cache-llvm
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

    - name: Ensure LLVM ${{ env.LLVM_VERSION }}
      run: just ci-env

    - name: Save LLVM ${{ env.LLVM_VERSION }} cache
      if: steps.cache-llvm.outputs.cache-hit != 'true' && github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name)
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: ${{ steps.cache-llvm.outputs.cache-primary-key }}

    - name: Run Python compatibility smoke test
      run: just python-ci-smoke

  python-slow-postmerge:
    if: github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PECOS_BUILD_MWPF: "1"
    steps:
    - name: Harden the runner (egress audit)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        tool-cache: false
        swap-storage: true

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.14"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.11.14"
        enable-cache: true
        save-cache: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}

    - name: Set up Rust
      run: |
        bash scripts/ci/ensure-rust.sh stable minimal
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show

    - name: Verify cmake is available (MWPF decoder build)
      run: cmake --version

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        prefix-key: v1-rust-no-bin
        save-if: ${{ github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name) }}
        workspaces: |
          python/pecos-rslib
          python/pecos-rslib-llvm

    - name: Cache LLVM ${{ env.LLVM_VERSION }}
      id: cache-llvm
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

    - name: Ensure LLVM ${{ env.LLVM_VERSION }}
      run: just ci-env

    - name: Save LLVM ${{ env.LLVM_VERSION }} cache
      if: steps.cache-llvm.outputs.cache-hit != 'true' && github.event_name == 'push' && contains(fromJSON('["main", "master", "development", "dev"]'), github.ref_name)
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: ${{ steps.cache-llvm.outputs.cache-primary-key }}

    - name: Build core Python packages
      run: just python-ci-build

    - name: Run slow Python tests
      run: just pytest-slow

  windows-vanilla-cargo:
    name: Windows vanilla cargo (crates.io consumer contract)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust (MSVC)
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          rustup toolchain install stable --profile minimal
          rustup default stable
          "$HOME\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup show

      - name: Assert no generated .cargo/config.toml (fail closed)
        shell: pwsh
        run: |
          if (Test-Path .cargo/config.toml) {
            Write-Error "repo .cargo/config.toml exists; the crates.io contract must hold WITHOUT it"
            exit 1
          }

      - name: Vanilla cargo check (publishable crates, no just/bootstrap)
        shell: pwsh
        run: cargo check --locked -p pecos-build -p pecos-core
