name: Python test / linting

env:
  TRIGGER_ON_PR_PUSH: true  # Set to true to enable triggers on PR pushes
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1
  LLVM_VERSION: "14.0.6"
  # Force the MWPF decoder feature on in CI so we exercise the cmake-dependent
  # build path and catch regressions. GitHub-hosted runners ship cmake.
  PECOS_BUILD_MWPF: "1"

on:
  push:
    branches: [ "main", "master", "development", "dev" ]
  pull_request:
    branches: [ "main", "master", "development", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Full Python version matrix on Ubuntu (fast)
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows/macOS: only test oldest and newest stable Python (slow platforms)
          - os: windows-2022
            python-version: "3.10"
          - os: windows-2022
            python-version: "3.14"
          - os: macOS-latest
            python-version: "3.10"
          - os: macOS-latest
            python-version: "3.14"

    steps:
    - name: Free Disk Space (Ubuntu)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        tool-cache: false
        swap-storage: true

    - name: Free Disk Space (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\hostedtoolcache\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\ProgramData\chocolatey" -Recurse -Force -ErrorAction SilentlyContinue

    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Visual Studio environment on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      # -NoPinLinker: let rustc auto-detect MSVC (vswhere) the same way local
      # Windows builds do, instead of pinning the linker (which disables rustc's
      # MSVC env setup and forces .cargo/config.toml LIB/INCLUDE surgery).
      run: ./scripts/ci/setup-msvc.ps1 -Arch x64 -HostArch x64 -NoPinLinker

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.14"
        enable-cache: true

    - name: Set up Rust (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        curl -sSf -o rustup-init.exe https://win.rustup.rs
        ./rustup-init.exe -y --default-toolchain stable --default-host x86_64-pc-windows-msvc --profile minimal
        "$HOME\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:Path += ";$HOME\.cargo\bin"
        rustup show

    - name: Set up Rust (Unix)
      if: runner.os != 'Windows'
      run: |
        curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show

    - name: Verify cmake is available (MWPF decoder build)
      run: cmake --version

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: false
        prefix-key: v1-rust-no-bin
        workspaces: |
          python/pecos-rslib
          python/pecos-rslib-llvm

    # Cache LLVM installation (fixed version, only varies by OS)
    - name: Cache LLVM ${{ env.LLVM_VERSION }}
      id: cache-llvm
      uses: actions/cache@v5
      with:
        path: ~/.pecos/deps/llvm-14
        key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

    # EXPERIMENT: no linker pin, no LIB/INCLUDE in .cargo/config.toml. We rely
    # on rustc's own vswhere-based MSVC detection (the exact path local Windows
    # builds use) to find link.exe and set up its LIB/INCLUDE. If this passes,
    # the linker pin / config.toml surgery was never needed and can be deleted
    # for good. We only ensure the .cargo dir exists so the LLVM step can write
    # LLVM_SYS_140_PREFIX (the one config value that is genuinely required and
    # is a single, mangling-safe path).
    - name: Prepare .cargo dir (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path .cargo | Out-Null

    - name: Ensure LLVM ${{ env.LLVM_VERSION }}
      run: just ci-env

    # EXPERIMENT: write ONLY LLVM_SYS_140_PREFIX into .cargo/config.toml -- no
    # linker pin, no LIB/INCLUDE. rustc auto-detects the MSVC linker + its
    # LIB/INCLUDE itself (vswhere), exactly like local Windows. LLVM_SYS_140_PREFIX
    # is a single path (no semicolons / mangling risk) and is genuinely required
    # by inkwell-using crates, so it stays.
    - name: Configure LLVM environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $escapedLLVM = $env:LLVM_SYS_140_PREFIX.Replace('\', '/')
        @"
        [env]
        LLVM_SYS_140_PREFIX = { value = "$escapedLLVM", force = true }
        "@ | Out-File -FilePath ".cargo\config.toml" -Encoding UTF8

    # Now install CLI (LLVM env is set, inkwell can find it)
    - name: Install PECOS CLI
      run: cargo install --path crates/pecos-cli --force

    # macOS: prevent Homebrew library path issues
    - name: Configure macOS environment
      if: runner.os == 'macOS'
      run: |
        # Prevent Homebrew library paths from causing @rpath/libunwind errors
        # Reference: https://github.com/rust-lang/rust/issues/135372
        echo "MPLBACKEND=Agg" >> $GITHUB_ENV
        echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
        echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
        echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV
        echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
        echo "LIBRARY_PATH=/usr/lib" >> $GITHUB_ENV

    - name: Build PECOS (macOS)
      if: runner.os == 'macOS'
      run: |
        # Prevent Homebrew library paths from causing @rpath/libunwind errors
        unset LIBRARY_PATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH PKG_CONFIG_PATH
        export LIBRARY_PATH=/usr/lib
        just build-debug

    # Two-level diagnostic to localize where the MSVC LIB is lost (the
    # step-level bash sees a correct LIB, but cold build-script links inside
    # `just` were failing on kernel32.lib). (1) step-level bash, (2) through the
    # exact `just -> #!/usr/bin/env bash` chain build-selene uses. Comparing the
    # two pinpoints whether `just`/the shebang layer drops or mangles LIB.
    # Non-fatal on the through-just side so we still capture the build failure
    # context; the step-level side fails fast on a clear regression.
    - name: Diagnose MSVC LIB across the just chain (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "=== step-level bash ==="
        echo "MSYS2_ENV_CONV_EXCL=${MSYS2_ENV_CONV_EXCL:-<unset>}"
        echo "LIB=${LIB:-<unset>}"
        case "${LIB:-}" in
          *"Windows Kits"*"um"*) echo "OK: Windows SDK um lib dir present in step-level LIB" ;;
          *) echo "ERROR: step-level LIB lacks a Windows SDK 'um' lib directory" >&2; exit 1 ;;
        esac
        echo "=== through just -> shebang-bash (build-selene's exact chain) ==="
        just _win-msvc-env-debug || true

    - name: Build PECOS
      if: runner.os != 'macOS'
      run: just build-debug

    - name: Verify macOS extension module
      if: runner.os == 'macOS'
      run: |
        EXT_MODULE=$(find .venv/lib -name "pecos_rslib*.so" 2>/dev/null | head -1)
        if [ -n "$EXT_MODULE" ]; then
          if otool -L "$EXT_MODULE" | grep -q "@rpath/libunwind"; then
            echo "ERROR: Extension has @rpath/libunwind reference"
            otool -L "$EXT_MODULE"
            exit 1
          fi
          echo "macOS extension module OK"
        fi

    - name: Run Python tests
      run: just pytest

    - name: Run slow Python tests
      # Only run on the primary Linux/newest-Python cell to keep the full
      # matrix fast. Dropping this entirely would let the `slow` lane
      # silently atrophy, which is exactly what the `slow` marker is
      # supposed to prevent.
      #
      # The `3.14` literal below must track the newest entry of the
      # `python-version` matrix at the top of this file (line ~34). Bump
      # both together.
      if: runner.os == 'Linux' && matrix.python-version == '3.14'
      run: just pytest-slow

    - name: Run linting
      run: just lint check
