name: Rust Version Consistency Check

permissions:
  contents: read

on:
  push:
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'julia/PECOS.jl/Project.toml'
      - 'scripts/check_rust_workspace.py'
      - '.github/workflows/rust-version-consistency.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'julia/PECOS.jl/Project.toml'
      - 'scripts/check_rust_workspace.py'
      - '.github/workflows/rust-version-consistency.yml'

jobs:
  check_rust_versions:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"

      - name: Check Rust workspace crate versions
        run: uv run --frozen python scripts/check_rust_workspace.py
