name: Selene General Noise Semantics

permissions:
  contents: read

on:
  push:
    tags: [ "py-*", "jl-*", "rs-*" ]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  # Every non-PR run keeps its validation, including schedules and dispatches.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0
  LLVM_VERSION: "21.1"
  LLVM_RELEASE_VERSION: "21.1.8"

jobs:
  extended-semantics:
    name: Extended device-neutral semantics
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # No harden-runner here: its audit agent grows to about 13.5 GB during the
      # Selene semantic suite and exhausts the runner's memory. The worker then
      # stops responding, so step timeouts never fire and the job log is lost.
      # Measured on 2026-10-24: with v2.19.4, v2.22.2 or disable-file-monitoring
      # the job ran out of memory; without the agent the suite passed with 11.5 GB
      # still free (runs 40101278752, 40104083813, 40104086962, 40104090440).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version-file: .github/uv.toml
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          prefix-key: v1-selene-general-noise-semantics
          save-if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      # The sim() parity tests build PECOS packages that link LLVM.
      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
          fallback: none

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: just ci-env

      - name: Build semantic-test plugins
        run: |
          cargo build --locked --release \
            -p pecos-selene-general-noise \
            -p pecos-selene-statevec
          mkdir -p python/selene-plugins/pecos-selene-general-noise/python/pecos_selene_general_noise/_dist/lib
          mkdir -p python/selene-plugins/pecos-selene-statevec/python/pecos_selene_statevec/_dist/lib
          cp target/release/libpecos_selene_general_noise.so \
            python/selene-plugins/pecos-selene-general-noise/python/pecos_selene_general_noise/_dist/lib/
          cp target/release/libpecos_selene_statevec.so \
            python/selene-plugins/pecos-selene-statevec/python/pecos_selene_statevec/_dist/lib/
          uv pip install --system \
            -e 'python/selene-plugins/pecos-selene-general-noise[test]' \
            -e python/selene-plugins/pecos-selene-statevec \
            -e python/pecos-rslib-llvm \
            -e python/pecos-rslib \
            -e python/quantum-pecos

      - name: Run extended semantic matrix
        # `set -o pipefail` is required: the default shell is `bash -e`, where the
        # exit status of a pipeline is `tee`'s, so a failing pytest would be reported
        # as a passing step and this lane could never go red.
        shell: bash
        # A step timeout below the job's lets the always() steps below publish the
        # log when the suite runs long; a job timeout cancels them and the log is lost.
        # The suite takes about 12 minutes on a warm runner.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          # The whole suite, not just `-m slow`: --require-full-noise-coverage fails
          # the session unless every required channel had a PASSING test, and the fast
          # cases carry evidence for several channels. The package's own addopts filter
          # is overridden so nothing is silently deselected.
          # faulthandler_timeout dumps every thread's stack when one test runs past
          # five minutes, so a stalled test names itself in the log.
          pytest python/selene-plugins/pecos-selene-general-noise/tests \
            --override-ini=addopts= --require-full-noise-coverage \
            -o faulthandler_timeout=300 --durations=30 \
            -v --tb=short | tee general-noise-semantic-results.txt

      - name: Publish channel coverage summary
        if: always()
        run: |
          echo '## General-noise semantic coverage' >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f general-noise-semantic-results.txt ]]; then
            echo 'The semantic-test log was not produced; inspect the earlier build steps.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          awk '
            /general-noise semantic coverage/ { capture = 1; next }
            capture && /^=+/ { exit }
            capture { print }
          ' general-noise-semantic-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload semantic-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selene-general-noise-semantic-results
          path: general-noise-semantic-results.txt
          if-no-files-found: warn
