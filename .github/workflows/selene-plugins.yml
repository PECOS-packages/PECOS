name: Selene Plugins

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0
  LLVM_VERSION: "21.1"
  LLVM_RELEASE_VERSION: "21.1.8"

on:
  # Merges into the main branches always run, whatever they touch.
  push:
    tags: [ "py-*", "jl-*", "rs-*" ]
    branches: [main, master, development, dev]
  # No `paths:` filter: GitHub applies it to label events too, so adding
  # ci:selene-plugins could never start a run on a PR that leaves
  # python/selene-plugins/ alone. The selene-changes job decides instead
  # (scripts/ci/pr-lane-should-run.sh).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master, development, dev]
  workflow_dispatch:
  # Measured 5-9 h delays shift this stagger outside working hours;
  # spread runner demand across the repository's five macOS slots.
  schedule:
    - cron: "7 21 * * *"

concurrency:
  # Pull requests cancel superseded runs. Every other event (a push to a main
  # branch, a schedule, a dispatch) gets its own group so no trunk commit loses
  # its validation or cache save to a later merge.
  # Unrelated label events must not cancel an active run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:selene-plugins' && github.run_id || 'validation' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  selene-changes:
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:selene-plugins'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to run Selene plugin CI
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Assign on its own line so a git failure aborts the step (fail closed).
        run: |
          run="$(bash scripts/ci/pr-lane-should-run.sh ci:selene-plugins \
            python/selene-plugins/ \
            python/pecos-rslib/src/sim.rs \
            python/pecos-rslib/src/engine_builders.rs \
            python/quantum-pecos/src/pecos/_sim.py \
            crates/pecos-engines/src/noise/ \
            crates/pecos-selene-general-noise-adapter/ \
            crates/pecos-qis/ \
            .github/workflows/selene-plugins.yml \
            scripts/ci/smoke_selene_wheel.py \
            Cargo.toml Cargo.lock uv.lock)"
          case "$run" in
            true|false) ;;
            *)
              echo "unexpected pr-lane-should-run output: <$run>" >&2
              exit 1
              ;;
          esac
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  # Build and test on the current platform (fast feedback)
  test:
    needs: selene-changes
    if: needs.selene-changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Linux also builds the PECOS packages for the cross-runtime parity tests
    # (about 14 min cold), and non-PR Linux runs add the extended semantic suite
    # (about 31 min); a cold non-PR run measured about 50 min.
    timeout-minutes: ${{ matrix.os != 'ubuntu-latest' && 30 || github.event_name != 'pull_request' && 75 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-2022]

    steps:
      # No harden-runner here: its audit agent grows to about 13.5 GB during the
      # Selene semantic suite and exhausts the runner's memory. The worker then
      # stops responding, so step timeouts never fire and the job log is lost.
      # Measured on 2026-10-24: with v2.19.4, v2.22.2 or disable-file-monitoring
      # the job ran out of memory; without the agent the suite passed with 11.5 GB
      # still free (runs 40101278752, 40104083813, 40104086962, 40104090440).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          # One cache per runner OS/arch, shared with build-wheels. Per-plugin caches
          # (6 plugins x 4 runners) filled the 10 GB repository cache on every dev
          # push and evicted the caches the PR core gate restores.
          shared-key: selene-plugins
          prefix-key: v1-rust-no-bin
          save-if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      # `uv pip install` re-resolves from PyPI and does NOT read uv.lock, so the
      # plugins' test extras drifted to whatever PyPI offered. Exporting the lock
      # as a constraints file keeps this lane on the same versions as every other
      # recipe. Reproducibility comes from uv.lock, not from tightening the
      # sub-packages' requires-dist -- those ship to PyPI and must stay installable.
      - name: Export locked versions as pip constraints
        run: |
          uv export --frozen --no-hashes --all-packages --no-emit-workspace \
            -o "${{ runner.temp }}/uv-constraints.txt"

      - name: Build and install Selene plugins (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXT="dylib"
          else
            EXT="so"
          fi

          # Discover all selene plugins, build, copy libraries, and install
          CARGO_ARGS=""
          for DIR in python/selene-plugins/pecos-selene-*/; do
            PLUGIN=$(basename "$DIR")
            CARGO_ARGS="$CARGO_ARGS -p $PLUGIN"
          done
          cargo build --locked --release $CARGO_ARGS

          for DIR in python/selene-plugins/pecos-selene-*/; do
            PLUGIN=$(basename "$DIR")
            LIB_NAME=$(echo "$PLUGIN" | tr '-' '_')
            DEST="python/selene-plugins/$PLUGIN/python/${LIB_NAME}/_dist/lib"
            mkdir -p "$DEST"
            cp "target/release/lib${LIB_NAME}.$EXT" "$DEST/"
            uv pip install --system -c "${{ runner.temp }}/uv-constraints.txt" -e "${DIR}[test]"
          done

      - name: Build and install Selene plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugins = Get-ChildItem -Directory python/selene-plugins/pecos-selene-* | Select-Object -ExpandProperty Name
          $cargoArgs = $plugins | ForEach-Object { "-p"; $_ }
          cargo build --locked --release @cargoArgs

          foreach ($plugin in $plugins) {
            $libName = $plugin -replace '-', '_'
            $dest = "python/selene-plugins/$plugin/python/$libName/_dist/lib"
            New-Item -ItemType Directory -Force -Path $dest
            Copy-Item "target/release/$libName.dll" "$dest/"
          }

          foreach ($pluginDir in (Get-ChildItem -Directory python/selene-plugins/pecos-selene-*)) {
            uv pip install --system -c "$env:RUNNER_TEMP/uv-constraints.txt" -e "$($pluginDir.FullName)[test]"
          }

      # The parity tests drive PECOS sim(), whose native packages link LLVM.
      # Linux is the only runner that provisions it here.
      - name: Install just
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
          fallback: none

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        if: runner.os == 'Linux'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        if: runner.os == 'Linux'
        run: just ci-env

      - name: Install PECOS cross-runtime parity dependencies
        if: runner.os == 'Linux'
        run: |
          uv pip install --system -c "${{ runner.temp }}/uv-constraints.txt" \
            -e python/pecos-rslib-llvm \
            -e python/pecos-rslib \
            -e python/quantum-pecos

      # Keep --release: only the LTO link reports an export that leaked into the
      # model crate (duplicate symbols with the test's own factory).
      - name: Test general-noise Rust composition
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --release -p pecos-selene-general-noise-adapter --test library

      - name: Run tests
        if: runner.os == 'Linux'
        run: |
          pytest python/selene-plugins/ -m "not slow" -v --tb=short

      # Without PECOS installed the modules that drive sim() cannot import, so
      # they are excluded by name rather than skipped: a broken install on Linux
      # fails instead of passing silently.
      - name: Run tests (without PECOS sim modules)
        if: runner.os != 'Linux'
        run: |
          pytest python/selene-plugins/ -m "not slow" -v --tb=short \
            --ignore=python/selene-plugins/pecos-selene-general-noise/tests/test_pecos_sim_bridge.py \
            --ignore=python/selene-plugins/pecos-selene-general-noise/tests/test_sim_parity.py

      - name: Run extended semantic tests
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          pytest python/selene-plugins/ -m slow -v --tb=short

  # Build wheels for distribution
  build-wheels:
    needs: test
    runs-on: ${{ matrix.os }}
    # Six sequential builds need headroom on the slower Intel macOS runner:
    # one plugin's Intel build alone has taken up to 338 s.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-2022]

    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          # Restore the test job's release build of every plugin; only that job saves.
          shared-key: selene-plugins
          prefix-key: v1-rust-no-bin
          save-if: false

      # Build separately to avoid unifying features across shipped libraries.
      # The test job uses editable installs; smoke-test each shipped wheel in
      # its own clean environment outside the checkout.
      - name: Build and smoke-test all plugin wheels
        shell: bash
        run: |
          uv export --frozen --no-hashes --all-packages --no-emit-workspace -o "$RUNNER_TEMP/uv-constraints.txt"
          case "$RUNNER_OS" in
            Linux) prefix=lib; extension=so ;;
            macOS) prefix=lib; extension=dylib ;;
            Windows) prefix=; extension=dll ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac

          build_plugin() {
            stage=build
            cargo build --locked --release -p "$plugin" || return
            stage=copy
            destination="$directory/python/$package/_dist/lib"
            mkdir -p "$destination" || return
            cp "target/release/$prefix$package.$extension" "$destination/" || return
            stage=wheel
            (cd "$directory" && uv build --wheel --out-dir "$RUNNER_TEMP/selene-wheels") || return
            stage=smoke
            venv="$(mktemp -d "$RUNNER_TEMP/wheel-$plugin.XXXXXX")" || return
            uv venv "$venv" --python 3.12 || return
            uv pip install --python "$venv" -c "$RUNNER_TEMP/uv-constraints.txt" "$RUNNER_TEMP/selene-wheels/$package"-*.whl || return
            venv_python="$venv/bin/python"
            if [ "$RUNNER_OS" = "Windows" ]; then venv_python="$venv/Scripts/python.exe"; fi
            (cd "$RUNNER_TEMP" && "$venv_python" "$GITHUB_WORKSPACE/scripts/ci/smoke_selene_wheel.py" "$package") || return
          }

          shopt -s nullglob
          directories=(python/selene-plugins/pecos-selene-*/)
          if [ "${#directories[@]}" -eq 0 ]; then
            echo "::error::No Selene plugins discovered"
            exit 1
          fi
          failures=()
          for directory in "${directories[@]}"; do
            plugin="$(basename "$directory")"
            package="${plugin//-/_}"
            echo "::group::$plugin"
            # Conditional functions do not inherit errexit: every stage above
            # explicitly returns on error so later plugins still get attempted.
            if build_plugin; then
              echo "$plugin: wheel and smoke test passed"
            else
              failures+=("$plugin ($stage)")
            fi
            echo "::endgroup::"
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            printf '::error::Failed plugin: %s\n' "${failures[@]}"
            exit 1
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/selene-wheels/*.whl
          if-no-files-found: error

  # Collect all wheels into a single artifact
  collect-wheels:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download all wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: wheels/
          pattern: wheel-*
          merge-multiple: true

      - name: Assert complete wheel set
        run: python3 scripts/ci/check_selene_wheels.py wheels/

      - name: List wheels
        run: |
          echo "=== All Selene plugin wheels ==="
          ls -la wheels/
          echo ""
          echo "=== Summary ==="
          echo "Total wheels: $(ls -1 wheels/*.whl 2>/dev/null | wc -l)"

      - name: Upload combined wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selene-plugin-wheels
          path: wheels/*.whl
          if-no-files-found: error
