name: Documentation Tests & Build

permissions:
  contents: read

on:
  push:
    branches: [ main, master, development, dev ]
    paths:
      - 'docs/**'
      - 'Justfile'
      - '.github/workflows/test-docs-examples.yml'
  pull_request:
    branches: [ main, master, development, dev ]
    paths:
      - 'docs/**'
      - 'Justfile'
      - '.github/workflows/test-docs-examples.yml'
  workflow_dispatch:

env:
  RUSTFLAGS: -C debuginfo=0
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1
  LLVM_VERSION: "21.1"
  LLVM_RELEASE_VERSION: "21.1.8"
  # rust-cache hashes CARGO_*/RUST* env into the key; keep these identical to
  # python-test.yml or the shared python-core cache silently misses.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  docs-ci:
    name: Test and build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".github/uv.toml"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev') }}

      - name: Set up Rust
        run: |
          bash scripts/ci/ensure-rust.sh stable minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin
          # Restore-only: python-core (python-test.yml) saves this key on dev pushes.
          save-if: false
          # The rslib crates are members of the root Cargo workspace and build
          # into the top-level target/, so cache the root workspace (the default)
          # and share the python-core key: same crates, same profile, same env.
          shared-key: python-core

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: cache-llvm
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: llvm-${{ env.LLVM_RELEASE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: just ci-env

      - name: Save LLVM ${{ env.LLVM_VERSION }} cache
        if: steps.cache-llvm.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'development' || github.ref_name == 'dev')
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.pecos/deps/llvm-21.1
          key: ${{ steps.cache-llvm.outputs.cache-primary-key }}

      - name: Install dependencies and build
        run: |
          uv lock --check --project .
          just python-ci-build-docs

      - name: Test documentation examples
        run: just docs-test

      - name: Build documentation
        if: success()
        run: uv run --frozen mkdocs build
