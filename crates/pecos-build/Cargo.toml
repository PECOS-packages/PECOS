[package]
name = "pecos-build"
version.workspace = true
edition.workspace = true
description = "PECOS build utilities - dependency management, LLVM setup, and build script helpers"
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["quantum", "llvm", "build-utils", "dependencies"]
categories = ["development-tools::build-utils"]

[features]
default = []

[dependencies]
# Directory management
dirs.workspace = true

# Downloading. reqwest uses rustls with no built-in provider; we install the
# ring crypto provider at runtime (see download.rs) to avoid aws-lc-sys, whose
# assembly rustc's bundled rust-lld mis-links.
reqwest.workspace = true
rustls.workspace = true

# Checksums
sha2.workspace = true

# Archive extraction
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
xz2.workspace = true
sevenz-rust2.workspace = true
zip.workspace = true
zstd.workspace = true

# Error handling
thiserror.workspace = true

# Logging
log.workspace = true

# Serialization (for manifest files)
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
toml_edit.workspace = true

# Cargo metadata parsing
cargo_metadata.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Writing 7z archives is test-only: it lets the extraction guard be exercised
# end to end against a hostile archive rather than only unit-testing the helper.
sevenz-rust2 = { workspace = true, features = ["compress"] }

[lints]
workspace = true
