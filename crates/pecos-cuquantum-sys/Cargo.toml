[package]
name = "pecos-cuquantum-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PECOS Developers"]
description = "Raw FFI bindings to NVIDIA cuQuantum SDK"
license = "Apache-2.0"
repository = "https://github.com/PECOS-packages/PECOS"
keywords = ["quantum", "cuda", "nvidia", "cuquantum", "ffi"]
categories = ["external-ffi-bindings", "science"]

[dependencies]

[build-dependencies]
bindgen = "0.71"
pecos-build = { path = "../pecos-build" }

[features]
default = []
# Generate bindings at build time (requires cuQuantum headers)
runtime-bindgen = []

[package.metadata.docs.rs]
# Don't try to build docs on docs.rs (no CUDA/cuQuantum available)
targets = []
