[package]
name = "pecos-phir"
version.workspace = true
edition.workspace = true
readme.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "PHIR (PECOS High-level Intermediate Representation) specification and execution capabilities for PECOS"

[features]
default = ["v0_1"]
v0_1 = []
all-versions = ["v0_1"]
wasm = ["wasmtime", "parking_lot"]

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pecos-core.workspace = true
pecos-engines.workspace = true
wasmtime = { version = "32.0.0", optional = true }
parking_lot = { version = "0.12.1", optional = true }

[dev-dependencies]
# Testing
tempfile = "3"
# Log testing dependencies
env_logger = "0.11.0"
test-log = "0.2.17"
tracing = "0.1.41"
once_cell = "1.20.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[lints]
workspace = true
