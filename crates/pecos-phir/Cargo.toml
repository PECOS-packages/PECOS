[package]
name = "pecos-phir"
version.workspace = true
edition.workspace = true
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MLIR-inspired quantum program intermediate representation for PECOS"

[dependencies]
# Core PECOS dependencies
pecos-core = { workspace = true, features = ["anyhow", "serde"] }
pecos-engines.workspace = true

# Logging
log.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }

# Error handling
thiserror.workspace = true

# Regular expressions for text processing
regex.workspace = true

# Temporary file handling for MLIR pipeline
tempfile.workspace = true

# RON (Rusty Object Notation) for debugging
ron.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
