[package]
name = "pecos-qec"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Quantum error correction utilities for PECOS"
readme = "README.md"

[dependencies]
ndarray.workspace = true
pecos-core.workspace = true
pecos-decoder-core.workspace = true
pecos-decoders.workspace = true
pecos-ldpc-decoders.workspace = true
pecos-num.workspace = true
pecos-quantum.workspace = true
pecos-simulators.workspace = true
pecos-random.workspace = true
# Optional: PerGateTypeNoise -> neo PerGatePauliChannel conversion
pecos-neo = { workspace = true, optional = true }
rand.workspace = true
rand_core.workspace = true
rayon.workspace = true
batsat.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
wide.workspace = true

# Optional runtime boundary. Circuit-only DEM builds do not load Selene or LLVM.
pecos-engines = { workspace = true, optional = true }
pecos-programs = { workspace = true, optional = true }
pecos-qis = { workspace = true, optional = true }
pecos-qis-ffi-types = { workspace = true, optional = true }
selene-hugr-qis-compiler = { git = "https://github.com/Quantinuum/tket2", rev = "6a4708c6289fa5f6c68cfed64b5bdd9dbdef1ded", default-features = false, optional = true }

# Select the workspace LLVM link mode for the compiler's inkwell.
inkwell = { workspace = true, optional = true }

[features]
selene = ["dep:pecos-engines", "dep:pecos-programs", "dep:pecos-qis", "dep:pecos-qis-ffi-types"]
hugr = ["selene", "dep:selene-hugr-qis-compiler", "dep:inkwell"]
# Convert PerGateTypeNoise to the pecos-neo noise channel for
# circuit-level Monte Carlo with the same noise that drives DEM export.
neo = ["dep:pecos-neo"]

[[test]]
name = "per_gate_neo_mapping_tests"
required-features = ["neo"]

[[example]]
name = "surface_d3_fault_catalog_lookup"
path = "../../examples/surface/d3_fault_catalog_lookup.rs"

[dev-dependencies]
pecos-phir.workspace = true
pecos-engines.workspace = true

[lints]
workspace = true
