[package]
name = "pecos-selene-general-noise-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "PECOS general noise as a Selene error model, for composing Selene plugins"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
pecos-core = { workspace = true }
pecos-engines = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# selene-core is a git dependency since it's not published to crates.io.
# Keep this revision aligned with the simulator plugins and pecos-qis.
selene-core = { git = "https://github.com/Quantinuum/selene.git", rev = "458d640dc4cf84a7a7988ea65ce5a9f7bcb8c511" }

[dev-dependencies]
nalgebra = { workspace = true }
num-complex = { workspace = true }
pecos-quantum = { workspace = true }
smallvec = { workspace = true }

[lints]
workspace = true
