[package]
name = "pecos-simulators"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Quantum simulator traits and implementations for PECOS"
readme = "README.md"

[features]
default = []
# Select parallel gate execution for large state vectors (20+ qubits).
# Provides 1.5x-7x speedups for single-shot workloads like amplitude calculation.
# Do NOT enable for multi-shot workloads where shots are parallelized at the
# orchestration level - this causes thread oversubscription and hurts throughput.
# Rayon itself is always a dependency: the stab_tn module parallelises behind
# runtime options.
parallel = []

