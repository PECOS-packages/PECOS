[package]
name = "pecos-wasm"
version = "0.1.1"
authors = ["The PECOS Developers"]
edition = "2024"
license = "Apache-2.0"
description = "WebAssembly foreign object support for PECOS"
repository = "https://github.com/PECOS-packages/PECOS"

[dependencies]
pecos-core = { path = "../pecos-core", version = "0.1.1" }
log = "0.4"
parking_lot = "0.12"

# Wasmtime dependencies (optional, enabled with "wasm" feature)
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "wat", "std"], optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasmtime"]
