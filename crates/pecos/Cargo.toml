[package]
name = "pecos"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "A crate for evaluating and exploring quantum error correction."
# Disable auto-discovery of binaries (we only want pecos binary, not engine_setup helper module)
autobins = false

[lib]
doctest = true
test = true

[[bin]]
name = "pecos"
path = "src/bin/pecos.rs"
required-features = ["cli"]

[dependencies]
pecos-core.workspace = true
pecos-qsim.workspace = true
pecos-engines.workspace = true
pecos-programs.workspace = true
pecos-qasm.workspace = true
pecos-phir-json.workspace = true
#pecos-qis-ffi-types.workspace = true
pecos-qis-core.workspace = true
pecos-qis-selene = { workspace = true, optional = true }
pecos-llvm = { workspace = true, optional = true }
pecos-hugr-qis = { workspace = true, optional = true }
pecos-phir = { workspace = true, features = ["hugr"] }
pecos-rng.workspace = true
pecos-num.workspace = true
log.workspace = true
tempfile.workspace = true
serde_json.workspace = true

# CLI dependencies (optional)
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
which = { version = "8", optional = true }

# Quantum simulator backends (optional - for Python bindings and advanced users)
pecos-cppsparsesim = { workspace = true, optional = true }
pecos-quest = { workspace = true, optional = true }
pecos-qulacs = { workspace = true, optional = true }

# WebAssembly foreign object support (optional)
pecos-wasm = { workspace = true, optional = true }

# Decoder backends (optional)
pecos-decoders = { workspace = true, optional = true }

[features]
default = ["qasm", "phir", "wasm", "cli"]

# CLI binary (included in default for easy `cargo install pecos`)
cli = ["dep:clap", "dep:env_logger", "dep:which", "qasm", "phir", "selene"]

# Program formats
qasm = []
phir = []

# Heavy external dependencies
llvm = ["pecos-qis-core/llvm", "pecos-llvm", "pecos-hugr-qis", "pecos-hugr-qis?/llvm"]
selene = ["pecos-qis-selene"]
wasm = ["pecos-wasm", "pecos-wasm/wasm"]

# Quantum simulator backends (C++ wrappers)
cppsparsesim = ["pecos-cppsparsesim"]
quest = ["pecos-quest"]
qulacs = ["pecos-qulacs"]
all-simulators = ["cppsparsesim", "quest", "qulacs"]

# GPU support
gpu = ["quest", "pecos-quest/gpu"]

# Decoder backends
ldpc = ["pecos-decoders", "pecos-decoders/ldpc"]
all-decoders = ["ldpc"]

# Everything
full = ["all-simulators", "all-decoders", "llvm", "selene", "wasm"]

[dev-dependencies]
tempfile.workspace = true
# Required for doctests
pecos-core.workspace = true
pecos-qsim.workspace = true
pecos-engines.workspace = true
pecos-qasm.workspace = true
pecos-phir = { workspace = true, features = ["hugr"] }
pecos-rng.workspace = true
log.workspace = true
serde_json.workspace = true

[[example]]
name = "quest_example"
required-features = ["quest"]

[lints]
workspace = true
