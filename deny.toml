[advisories]
yanked = "deny"
unmaintained = "none"
unsound = "none"
ignore = [
    # Every zip release before 9.0 is yanked. relay-bp 0.2.2 (the latest) reads
    # and writes .npz files through ndarray-npy 0.9, which requires zip ^2, and
    # no newer ndarray-npy or relay-bp release moves to zip 9. Relay-BP is an
    # opt-in feature (`relay-bp` on pecos-decoders and pecos), so default builds
    # and downstream users do not depend on it; pecos-rslib enables it for the
    # Python RelayBpDecoder and builds from Cargo.lock. Remove this entry when
    # relay-bp releases on a non-yanked zip.
    { crate = "zip@2.4.2", reason = "only reachable through the opt-in relay-bp feature; no non-yanked zip ^2 exists" },
    # The same zip@2.4.2 has advisories against ZipArchive::extract and
    # ZipStreamReader::extract only. ndarray-npy reads .npz entries by name and
    # relay-bp never extracts archives, so neither affected API is called. Remove
    # these with the zip@2.4.2 entry above.
    { id = "RUSTSEC-2026-0367", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() SUID/SGID handling is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() symlink targets are never created" },
    { id = "RUSTSEC-2026-0369", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() permissions through symlinks are never applied" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-wildcard-paths = true
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/Quantinuum/selene",
    "https://github.com/yuewuo/mwpf",
]
unused-allowed-source = "allow"
