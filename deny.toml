[advisories]
yanked = "deny"
unmaintained = "none"
unsound = "none"
ignore = [
    # zip@2.4.2 is reachable only through the opt-in relay-bp feature
    # (`relay-bp` on pecos-decoders and pecos; pecos-rslib enables it for the
    # Python RelayBpDecoder): relay-bp 0.2.2 (the latest) reads .npz files
    # through ndarray-npy 0.9, which requires zip ^2. That zip has advisories
    # against ZipArchive::extract and ZipStreamReader::extract only;
    # ndarray-npy reads .npz entries by name and relay-bp never extracts
    # archives, so neither affected API is called. These ids are not
    # version-scoped, but only zip < 9.0 is affected and the workspace's own zip
    # is 9.x. Remove them when relay-bp moves to zip 9 or is replaced.
    { id = "RUSTSEC-2026-0367", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() SUID/SGID handling is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() symlink targets are never created" },
    { id = "RUSTSEC-2026-0369", reason = "zip@2.4.2 via relay-bp -> ndarray-npy; extract() permissions through symlinks are never applied" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-wildcard-paths = true
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/Quantinuum/selene",
    "https://github.com/yuewuo/mwpf",
]
unused-allowed-source = "allow"
