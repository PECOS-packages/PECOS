[advisories]
yanked = "deny"
unmaintained = "none"
unsound = "none"
# relay-bp 0.2.2 (latest) requires ndarray-npy ^0.9.1, which requires zip ^2;
# every zip 2.x release is yanked. Remove once relay-bp moves to an unyanked zip.
ignore = [{ crate = "zip@2.4.2", reason = "only reachable through relay-bp; no unyanked zip 2.x exists" }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-wildcard-paths = true
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/Quantinuum/selene",
    "https://github.com/yuewuo/mwpf",
]
unused-allowed-source = "allow"
