<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical QEC instruction space-time volumes</title>
  <desc id="desc">A memory experiment volume contains preparation, three syndrome extraction rounds, and measurement. One round is expanded to show preparation, interactions, and measurement operating on data and ancilla resources over time.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .muted { fill: #526078; }
      .wire { fill: none; stroke: #334155; stroke-width: 3; }
      .port { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <rect x="20" y="20" width="1060" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="55" y="58" class="label">Coarse view: one instruction cell contains other cells</text>
  <rect x="55" y="78" width="990" height="252" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="76" y="108" class="small muted">memory_experiment implementation volume</text>

  <line x1="91" y1="199" x2="1004" y2="199" class="wire" marker-end="url(#arrow)"/>
  <text x="965" y="185" class="small muted">time</text>
  <rect x="72" y="177" width="38" height="44" rx="4" class="port"/>
  <text x="60" y="244" class="tiny muted">patch in</text>

  <g filter="url(#shadow)">
    <rect x="130" y="145" width="125" height="108" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="192" y="192" text-anchor="middle" class="label">prepare Z</text>
    <text x="192" y="215" text-anchor="middle" class="tiny muted">cell instance</text>

    <rect x="285" y="125" width="485" height="148" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="527" y="151" text-anchor="middle" class="label">syn_extract implementation volume</text>
    <rect x="308" y="169" width="130" height="76" rx="8" fill="#a7f3d0" stroke="#047857"/>
    <rect x="462" y="169" width="130" height="76" rx="8" fill="#a7f3d0" stroke="#047857"/>
    <rect x="616" y="169" width="130" height="76" rx="8" fill="#a7f3d0" stroke="#047857"/>
    <text x="373" y="201" text-anchor="middle" class="small">round 1</text>
    <text x="527" y="201" text-anchor="middle" class="small">round 2</text>
    <text x="681" y="201" text-anchor="middle" class="small">round 3</text>
    <text x="373" y="224" text-anchor="middle" class="tiny muted">child cell</text>
    <text x="527" y="224" text-anchor="middle" class="tiny muted">child cell</text>
    <text x="681" y="224" text-anchor="middle" class="tiny muted">child cell</text>

    <rect x="800" y="145" width="125" height="108" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="862" y="192" text-anchor="middle" class="label">measure Z</text>
    <text x="862" y="215" text-anchor="middle" class="tiny muted">cell instance</text>
  </g>

  <rect x="955" y="177" width="38" height="44" rx="4" class="port"/>
  <text x="944" y="244" class="tiny muted">result out</text>
  <text x="133" y="291" class="small muted">The patch cross-section is carried through connected boundary ports.</text>

  <path d="M373 245 C373 318, 310 337, 310 370" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="55" y="389" class="label">Peek inside one syndrome-round realization</text>
  <rect x="55" y="410" width="990" height="178" rx="16" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>

  <line x1="86" y1="511" x2="1010" y2="511" class="wire" marker-end="url(#arrow)"/>
  <text x="971" y="543" class="small muted">time</text>
  <rect x="80" y="468" width="900" height="32" rx="6" fill="#bfdbfe" stroke="#2563eb"/>

  <rect x="122" y="430" width="115" height="58" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="179" y="456" text-anchor="middle" class="small">ancilla prep</text>
  <text x="179" y="475" text-anchor="middle" class="tiny muted">child cell</text>

  <rect x="277" y="445" width="112" height="76" rx="8" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="419" y="445" width="112" height="76" rx="8" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="561" y="445" width="112" height="76" rx="8" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="703" y="445" width="112" height="76" rx="8" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="333" y="477" text-anchor="middle" class="small">interact 1</text>
  <text x="475" y="477" text-anchor="middle" class="small">interact 2</text>
  <text x="617" y="477" text-anchor="middle" class="small">interact 3</text>
  <text x="759" y="477" text-anchor="middle" class="small">interact 4</text>
  <text x="333" y="500" text-anchor="middle" class="tiny muted">gate cells</text>
  <text x="475" y="500" text-anchor="middle" class="tiny muted">gate cells</text>
  <text x="617" y="500" text-anchor="middle" class="tiny muted">gate cells</text>
  <text x="759" y="500" text-anchor="middle" class="tiny muted">gate cells</text>

  <rect x="855" y="430" width="115" height="58" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="912" y="456" text-anchor="middle" class="small">ancilla meas</text>
  <text x="912" y="475" text-anchor="middle" class="tiny muted">child cell</text>

  <path d="M179 488 L179 548 L912 548 L912 488" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="700" y="575" class="small muted">ancilla resource lifetime</text>
  <path d="M289 570 L320 518" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="578" class="small muted">data-patch world-tube (space x/y)</text>
  <text x="672" y="614" class="small muted">Hierarchy can stay collapsed or expand to physical-circuit detail.</text>
</svg>
