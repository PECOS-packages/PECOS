<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Quantum circuit representation -->
  <rect x="1" y="1" width="14" height="14" rx="2" fill="#4A90D9" stroke="#2E6BB0" stroke-width="0.5"/>
  <!-- Q for quantum -->
  <text x="8" y="12" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Q</text>
  <!-- Small circuit lines -->
  <line x1="2" y1="4" x2="5" y2="4" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <line x1="11" y1="4" x2="14" y2="4" stroke="white" stroke-width="0.5" opacity="0.6"/>
</svg>
