    { name = "patchelf", marker = "sys_platform != 'win32'" },
    { name = "pytest" },
    { name = "quantum-pecos" },
]
test = [
    { name = "pytest" },
    { name = "quantum-pecos" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [
    { name = "patchelf", marker = "sys_platform != 'win32'" },
    { name = "pytest", specifier = ">=9.0.2" },
    { name = "quantum-pecos", editable = "../../python/quantum-pecos" },
]
test = [
    { name = "pytest", specifier = ">=7.0" },
    { name = "quantum-pecos", editable = "../../python/quantum-pecos" },
]
