id = "GHSA-m665-v7pm-7grj"
# zip@2.4.2 -- ZipArchive and ZipStreamReader disagree when the local and central
# headers of an entry differ. Fixed only in zip 9.0.5.
# Chain: relay-bp 0.2.2 -> ndarray-npy 0.9.1 -> zip ^2 (same chain as
# RUSTSEC-2026-0367..0369). The ignore is not version-scoped, but the workspace
# requires zip >= 9.0.5, so it cannot hide the first-party pecos-build path.
# Upstream owners: https://github.com/trmue/relay and https://github.com/jturner314/ndarray-npy.
reason = "Transitive via relay-bp/ndarray-npy, which reads .npz entries only through ZipArchive and never uses ZipStreamReader, so no second parser sees the archive."

[[IgnoredVulns]]
id = "GHSA-8hxf-qr8p-62x4"
# zip@2.4.2 -- an AES entry's HMAC is skipped when the entry ends early. Fixed in 9.0.0.
# Chain: relay-bp 0.2.2 -> ndarray-npy 0.9.1 -> zip ^2 (same chain as
# RUSTSEC-2026-0367..0369). ndarray-npy depends on zip with default-features = false
# and nothing enables aes-crypto, so src/aes.rs is not compiled; Cargo.lock shows
# zip 2.4.2 without aes, hmac or pbkdf2. The workspace requires zip >= 9.0.5.
# Upstream owners: https://github.com/trmue/relay and https://github.com/jturner314/ndarray-npy.
reason = "Transitive via relay-bp/ndarray-npy, which build zip without the aes-crypto feature, so the AES reader is not compiled, and never pass a password."

[[IgnoredVulns]]
id = "GHSA-q7v9-x93c-xqv3"
# zip@2.4.2 -- ZipArchive::extract() and extract_unwrapped_root_dir() size a
# symlink-target buffer from the declared size and can abort on allocation. Fixed in 9.0.0.
# Chain: relay-bp 0.2.2 -> ndarray-npy 0.9.1 -> zip ^2 (same chain as
# RUSTSEC-2026-0367..0369). The workspace requires zip >= 9.0.5.
# Upstream owners: https://github.com/trmue/relay and https://github.com/jturner314/ndarray-npy.
reason = "Transitive via relay-bp/ndarray-npy, which read .npz entries only through ZipArchive::by_name and by_index and never call ZipArchive::extract or extract_unwrapped_root_dir, the paths that reach the affected symlink branch."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
# block-buffer@0.10.4 -- the advisory covers buffers that keep their cursor inside the
# block bytes (EagerBuffer, ReadBuffer), where an unwinding callback can leave it out
# of range. Fixed in 0.12.1; the range is open below that, with no 0.10.x release.
# 0.10.4 has neither shape: its cursor is a separate `pos` field that digest_blocks
# sets only after the callback returns, and it has no ReadBuffer.
# Chain: block-buffer 0.10 -> digest 0.10 -> sha2 0.10 -> wasmtime-environ 48 and
# cranelift-codegen (incremental-cache, enabled unconditionally by
# wasmtime-internal-cranelift). wasmtime 50 and main (51.0.0-dev) still require sha2 0.10.
# Upstream owner: https://github.com/bytecodealliance/wasmtime. Re-check on wasmtime bumps.
reason = "Transitive via wasmtime/cranelift -> sha2 0.10; block-buffer 0.10.4 stores its cursor outside the block and updates it only after the callback returns, so an unwinding callback cannot leave it out of range, and it has no ReadBuffer."
