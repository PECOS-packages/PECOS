id = "RUSTSEC-2026-0367"
# zip@2.4.2 -- SUID/SGID bits preserved by extract().
# Chain: relay-bp 0.2.2 -> ndarray-npy 0.9.1 -> zip ^2, reached through
# pecos-relay-bp: the relay-bp feature of pecos-decoders (pecos-rslib enables it
# for the Python RelayBpDecoder), exp/pecos-phase-poly, and pecos-bp's parity tests.
# Upstream owners: https://github.com/trmue/relay and https://github.com/jturner314/ndarray-npy.
reason = "Transitive via relay-bp/ndarray-npy, which read .npz entries by name and never call ZipArchive::extract or ZipStreamReader::extract, the affected APIs."

