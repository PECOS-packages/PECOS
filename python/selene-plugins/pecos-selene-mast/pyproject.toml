[project]
name = "pecos-selene-mast"
version = "0.9.0.dev3"
requires-python = ">=3.10"
description = "PECOS Mast simulator plugin for the Selene quantum emulator"
license = "Apache-2.0"
dependencies = [
    "selene-core>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "selene-sim>=0.2,<0.3",
    "guppylang>=0.14,<1.0",
]

[project.urls]
homepage = "https://pecos.io"
repository = "https://github.com/PECOS-packages/PECOS"

[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pecos_selene_mast"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
]
