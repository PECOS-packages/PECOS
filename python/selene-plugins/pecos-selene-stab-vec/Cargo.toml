[package]
name = "pecos-selene-stab-vec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "PECOS StabVec simulator plugin for the Selene quantum emulator"

[lib]
name = "pecos_selene_stab_vec"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
pecos-core = { workspace = true }
pecos-simulators = { workspace = true }
# selene-core is a git dependency since it's not published to crates.io
# Use the same revision as the other selene plugins for consistency
selene-core = { git = "https://github.com/Quantinuum/selene.git", rev = "01300ee5d4825e2dfc6500941d0540c3ff06988a" }

[lints]
workspace = true
