[project]
name = "pecos-selene-stab-vec"
version = "0.10.0.dev0"
requires-python = ">=3.12"
description = "PECOS StabVec simulator plugin for the Selene quantum emulator"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "selene-core>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "selene-sim~=0.3.0",
    "guppylang~=1.0.1",
]

[project.urls]
homepage = "https://pecos.io"
repository = "https://github.com/PECOS-packages/PECOS"

[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pecos_selene_stab_vec"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
]
