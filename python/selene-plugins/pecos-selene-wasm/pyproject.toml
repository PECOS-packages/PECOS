[project]
name = "pecos-selene-wasm"
version = "0.11.0.dev0"
requires-python = ">=3.12"
description = "Public Guppy WASM lowering and Selene utility runtime"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "selene-core~=0.3.0",
    "selene-hugr-qis-compiler>=0.4.2,<0.6",
    "hugr~=0.18.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0", "selene-sim~=0.3.0", "guppylang>=1.0.1,<1.3", "hatchling", "packaging"]

[project.urls]
homepage = "https://pecos.io"
repository = "https://github.com/PECOS-packages/PECOS"

[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pecos_selene_wasm"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# Invalidate uv's wheel cache before the hook asks Cargo to check native freshness.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "python/**/*.py" },
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "../../../Cargo.toml" },
    { file = "../../../Cargo.lock" },
    { file = "../../../crates/**/Cargo.toml" },
    { file = "../../../crates/**/*.rs" },
]
